version: '3.8'

services:
  # --- Jaeger: receive trace through OTLP, display UI watch trace ---
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: warehouse_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI -> http://localhost:16686

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: warehouse-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC receiver (Spring Boot push to this port)
      - "4318:4318"     # OTLP HTTP receiver (Spring Boot push to this port if HTTP)
    depends_on:
      - jaeger